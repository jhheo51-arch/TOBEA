<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JH 기획 · 이유 있는 기획</title><link rel="stylesheet" href="style.css"><script src="core.js" defer></script><script src="examples.js" defer></script><script src="app.js" defer></script></head><body>
<a href="#main" class="skip">본문으로 이동</a>
<aside class="sidebar"><a class="brand" href="#" id="home-link"><b>JH<span>.</span></b><div>기획<small>이유 있는 기획</small></div></a><div class="side-label">WORKSPACE</div><button class="side-home" id="home-button"><span class="grid-icon" aria-hidden="true"></span>내 프로젝트</button><div class="side-projects" id="side-projects"></div><button class="side-new" data-new>＋ 새 프로젝트</button><div class="side-bottom"><span class="live-dot"></span>기획에 집중하는 공간<p>문제에서 시작해<br>선택의 이유를 남깁니다.</p><div class="side-tools"><button data-backup>기록 백업</button><button data-restore>불러오기</button></div></div></aside>
<div class="shell"><header class="topbar"><span id="breadcrumb">작업실 / 내 프로젝트</span><div><span class="saved-dot" aria-hidden="true"></span><span id="save-status" role="status">이 브라우저에 보관</span><button class="button compact" data-new>새 기획 ＋</button></div></header><main id="main" tabindex="-1"></main><footer><span>JH PLANNING</span><span>문제 · 지표 · 문서</span><div><button data-backup>백업</button><button data-restore>불러오기</button><span>기획 작성 버전</span></div></footer></div>
<dialog id="new-dialog"><form id="new-form"><div class="eyebrow">A NEW BEGINNING</div><h2>어떤 기획을 시작할까요?</h2><label for="new-name">프로젝트 이름<input id="new-name" required maxlength="100" placeholder="예: 새로운 서비스의 첫 홍보"></label><label for="new-industry">산업·활동 맥락 <small>선택</small><input id="new-industry" maxlength="100" placeholder="정하지 않아도 시작할 수 있어요"></label><div class="dialog-actions"><button class="button" type="button" id="cancel-new">취소</button><button class="button primary" type="submit">시작하기 →</button></div></form></dialog>
<input id="restore-file" type="file" accept=".json,application/json" hidden><div id="toast" role="status" aria-live="polite"></div><div id="print-area" hidden></div>
</body></html>
