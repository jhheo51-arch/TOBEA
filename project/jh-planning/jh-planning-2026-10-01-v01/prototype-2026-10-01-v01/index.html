<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JH 기획 · 기획 작업실</title>
  <link rel="stylesheet" href="style.css"><script src="core.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <aside class="sidebar">
    <a class="brand" href="#" id="home-link"><span class="brand-mark">JH<span>.</span></span><span>기획<span class="brand-sub">이유 있는 시작을 만듭니다</span></span></a>
    <div class="side-label">기획 작업실</div>
    <button class="side-home active" id="home-button"><span>▦</span> 내 프로젝트</button>
    <div class="side-list" id="side-list"></div>
    <button class="side-new" data-action="new">＋ 새 프로젝트</button>
    <div class="side-bottom"><span class="status-dot"></span> 기획 작성 버전<p>내용은 이 브라우저에 저장됩니다.<br>다른 기기로 자동 연결되지 않습니다.</p><button class="text-button" id="backup">전체 기록 백업</button><button class="text-button" id="restore">백업 불러오기</button><input type="file" id="restore-file" accept=".json,application/json" hidden></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><span id="breadcrumb">작업실 / 내 프로젝트</span><div><span id="save-status" role="status">저장된 프로젝트 없음</span><button class="button small" data-action="new">새 프로젝트 ＋</button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer>JH 기획 <span>무엇을 왜 해야 하는지, 그 이유부터.</span><div class="mobile-tools"><button class="text-button" id="backup-mobile">전체 기록 백업</button><button class="text-button" id="restore-mobile">백업 불러오기</button></div><span>AI 연결 전 · 기획 작성 서비스</span></footer>
  </div>
  <dialog id="create-dialog"><form id="create-form"><div class="eyebrow">새로운 시작</div><h2>어떤 기획을 시작할까요?</h2><p class="muted">산업은 달라도, 좋은 기획은 같은 질문에서 시작합니다.</p><label>프로젝트 이름 <span class="required">필수</span><input id="new-name" maxlength="100" required placeholder="예: 새로운 서비스의 첫 홍보"></label><label>산업·활동 맥락 <span class="optional">선택</span><input id="new-industry" maxlength="100" placeholder="식음료, 교육, 문화, 기업 서비스 등"></label><div class="dialog-actions"><button class="button" type="button" id="cancel-create">취소</button><button class="button primary" type="submit">기획 시작하기 →</button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body></html>
