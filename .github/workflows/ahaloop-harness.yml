name: AHALOOP harness

on:
  pull_request:
    paths:
      - "project/ahaloop/**"
      # main requires this real integration check for MEMOIVE PRs as well.
      - "project/memoive/**"
      - "project/proofline/**"
      - ".github/workflows/ahaloop-*.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "project/ahaloop/**"
      - "project/proofline/**"
      - ".github/workflows/ahaloop-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahaloop-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: AHALOOP harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/ahaloop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/ahaloop/package-lock.json
      - run: npm ci
      - run: npm run harness:pass

